<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>TeemoBKK Live News</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--text:#eaf0ff;--muted:#91a0bd;--line:#273656;--accent:#64d7ff;--hot:#ffb86b;--official:#8fe3a8;--draft:#d9b3ff;--thai:#ffd479}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}h1{font-size:28px;margin:2px 0 0}.status{color:var(--muted);text-align:right}.status strong{color:var(--text)}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px 10px 0 0;padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px}.tabbtn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}.tabbtn.active.th{border-color:var(--thai);color:var(--thai)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:14px}.toolbar.th{border-color:#4a3c1e}.toolbar[hidden]{display:none}button,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}button.active{border-color:var(--accent);color:var(--accent)}button.th.active{border-color:var(--thai);color:var(--thai)}select{margin-left:auto}input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;min-width:230px}.more-wrap{display:flex;justify-content:center;padding:16px 0 4px}#more{padding:10px 26px;font-weight:700}mark{background:#4a3c1e;color:#ffe9b0;border-radius:3px;padding:0 2px}body.public .admin{display:none!important}body.public .side{display:none}body.public .layout{grid-template-columns:minmax(0,1fr)}body.public select#interval,body.public label[for=interval]{display:none}@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:21px}.title{font-size:15px}.card{padding:12px}input[type=search]{flex:1 1 100%;min-width:0}.toolbar{padding:10px}button{padding:9px 12px}}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.feed{display:grid;gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}.card:hover{border-color:#48648f}.card.th:hover{border-color:#6b5726}.meta{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.title{font-size:16px;font-weight:700;margin:7px 0}.summary{color:#b9c5dc;margin:7px 0 3px}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:11px;background:#263554;color:#c9d8f5}.badge.official{color:var(--official);background:#17362a}.badge.hot{color:var(--hot);background:#3b2b1d}.badge.th{color:var(--thai);background:#3a2f14}.rating{color:var(--hot);letter-spacing:1px}.impact{color:#c9d8f5;background:#16243b;border-left:3px solid var(--accent);padding:7px 9px;margin:9px 0;font-size:12px}.impact b{color:var(--accent)}.side{display:grid;align-content:start;gap:12px}.box{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}.box h2{font-size:14px;margin:0 0 8px}.source{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #1d2942}.ok{color:var(--official)}.bad{color:#ff8b8b}.empty{padding:22px;color:var(--muted);text-align:center}.note{color:var(--muted);font-size:12px}
</style>
</head>
<body><main class="wrap">
<div style="display:none"><span id="lbl-ok">정상 연결</span><span id="lbl-retry">연결 재시도 중 · 캐시 표시</span><span id="lbl-collect">수집:</span><span id="lbl-open">원문 열기 ↗</span><span id="lbl-empty">현재 필터에 해당하는 뉴스가 없습니다.</span><span id="lbl-sub">정상</span><span id="lbl-fail">실패</span></div>

<header class="top"><div><div class="eyebrow">TeemoBKK Live News</div><h1>실시간 뉴스 대시보드</h1><div class="note">최근 12시간 발행 기사만 표시</div></div><div class="status">상태: <strong id="state">연결 중</strong><br><span id="updated">업데이트 대기</span></div></header>
<div class="tabs"><button id="tab-global" class="tabbtn active" data-tab="global" data-region="글로벌">글로벌 매크로·크립토</button><button id="tab-thai" class="tabbtn th" data-tab="thai" data-region="태국">태국 소식</button></div>
<section class="toolbar"><input id="q" type="search" placeholder="제목·요약 검색"><label class="note" for="hours">기간</label><select id="hours"><option value="1">1시간</option><option value="6">6시간</option><option value="12">12시간</option><option value="24" selected>24시간</option></select><span class="note">총 <b id="cnt">0</b>건 · 표시 <b id="shown">0</b>건 · 보관 <b id="arch">0</b>건</span></section>
<section id="filters-global" class="toolbar"><button class="active" data-mode="all" data-filter="전체">전체</button><button data-mode="priority" data-value="5" data-filter="★★★★★">★★★★★ 심</button><button data-filter="유동성·금리">유동성·금리</button><button data-filter="미국 정책·트럼프">미국 정책·트럼프</button><button data-filter="지정학">지정학</button><button data-filter="ETF·수급">ETF·수급</button><button data-filter="파생상품·청산">파생상품·청산</button><button data-filter="온체인·기관">온체인·기관</button><button data-filter="스테이블코인">스테이블코인</button><button data-filter="X 발언">X 발언</button><button data-filter="주식·원자재">주식·원자재</button><button data-filter="채굴">채굴</button><button data-filter="규제·정책">규제·정책</button><button data-filter="거시경제">거시경제</button><button data-filter="시장·가격">시장·가격</button><button data-filter="이더리움·알트">이더리움·알트</button><button data-mode="source" data-value="FinancialJuice" data-filter="파이낸셜쥬스">파이낸셜쥬스</button><button data-mode="source" data-value="CoinNess" data-filter="코인네스">코인네스</button><button data-mode="source" data-value="SBHNews" data-filter="SBH뉴스">SBH뉴스</button><button data-mode="official" data-filter="공식">공식 발표</button><label class="note" for="interval">갱신 간격</label><select id="interval"><option value="10">10초</option><option value="30">30초</option><option value="60" selected>1분</option><option value="120">2분</option><option value="300">5분</option></select></section>
<section id="filters-thai" class="toolbar th" hidden><button class="th active" data-mode="all" data-filter="전체">전체</button><button class="th" data-mode="priority" data-value="5" data-filter="★★★★★">★★★★★ 중요</button><button class="th" data-filter="비자·이민">비자·이민</button><button class="th" data-filter="사고·재난">사고·재난</button><button class="th" data-filter="태국 생활">생활·교통·날씨</button><button class="th" data-filter="태국 경제">태국 경제</button><button class="th" data-filter="태국 정치·사회">정치·사회</button><button class="th" data-filter="태국 관광">관광</button><button class="th" data-filter="태국 보건">보건</button></section>
<div class="layout"><section><div id="feed" class="feed"><div class="empty">뉴스를 불러오는 중입니다.</div></div><div class="more-wrap"><button id="more" hidden>더 보기</button></div></section><aside class="side"><div class="box admin"><h2>수집 상태</h2><div id="sources"></div></div><div class="box admin" id="tguide"></div></aside></div>
</main>
<script>
const PUBLIC=!!window.__PUBLIC__;if(PUBLIC){document.body.classList.add('public')}
const stateLabel=document.querySelector('#lbl-ok').textContent;
const retryLabel=document.querySelector('#lbl-retry').textContent;
const emptyLabel=document.querySelector('#lbl-empty').textContent;
const okLabel=document.querySelector('#lbl-sub').textContent;
if(PUBLIC){const c=document.querySelector('#cnt');if(c&&c.closest('.note'))c.closest('.note').classList.add('admin')}
const failLabel=document.querySelector('#lbl-fail').textContent;
const collectLabel=document.querySelector('#lbl-collect').textContent+' ';
const openLabel=document.querySelector('#lbl-open').textContent;
let data={articles:[],sources:{},total:0,has_more:false};let state={tab:'global',mode:'all',value:'',filter:'',hours:24,q:'',offset:0,limit:15};let refreshTimer=null;const CACHE_KEY='teemo-live-news-cache-v3';const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8765':'';try{const saved=localStorage.getItem(CACHE_KEY);if(saved){const sn=JSON.parse(saved);if(sn&&sn.region_counts)data=sn}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(iso){if(!iso)return '시각 미상';const d=new Date(iso),sec=Math.max(0,(Date.now()-d.getTime())/1000);if(sec<60)return Math.floor(sec)+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';return d.toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function hl(t){const txt=esc(t??'');const q=(state.q||'').trim();if(!q)return txt;const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return txt.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>')}catch(e){return txt}}
function stars(priority){return '★'.repeat(Math.max(1,Math.min(5,Number(priority)||1)));}
const GLOBAL_IMPACT={'유동성·금리':'유동성·금리 → 달러·국채 금리 → 위험자산 선호 → BTC','미국 정책·트럼프':'정책·관세 기대 → 달러·금리와 규제 전망 → BTC 변동성','지정학':'전쟁·제재 → 원유·달러·금리 → 위험회피 또는 대체자산 수요','ETF·수급':'기관 현물 자금 → 즉시 매수·매도 압력 → BTC','파생상품·청산':'레버리지 포지션 → 강제 청산 → 가격 변동 확대','온체인·기관':'고래·기관·거래소 유입 → 잠재 매도·매수 압력','스테이블코인':'스테이블코인 공급·거래소 잔액 → 대기 유동성 → BTC','X 발언':'유명 인사 발언 → 단기 심리·거래량 → BTC 변동성','주식·원자재':'주식·원자재 움직임 → 위험 선호와 인플레이션 기대 → BTC','채굴':'채굴자 비용·보유량 → 공급 압력 → BTC','규제·정책':'규제·과세·법안 → 거래 환경과 자금 흐름 → BTC','거시경제':'고용·물가·연준 발언 → 금리 기대 → 위험자산 선호 → BTC','시장·가격':'가격 급등락 → 추세·심리 변화 → BTC','이더리움·알트':'ETH·알트 수급 → 시장 전체 온기 → BTC'};
const THAI_IMPACT={'비자·이민':'체류·비자 규정 변화 → 교민 거주 계획과 비용에 직접 영향','사고·재난':'사고·재난 → 해당 지역 이동과 안전 확인 필요','태국 생활':'교통·수도·전기·날씨 → 일상 이동과 생활비에 영향','태국 경제':'밧·물가·금리 → 생활비와 송금 환율에 영향','태국 정치·사회':'정책·시위 → 치안과 행정 처리 일정에 영향','태국 관광':'관광 수요 → 지역 혼잡과 물가에 영향','태국 보건':'보건·의료 → 병원 이용과 건강 관리에 영향'};
function impact(a){if(PUBLIC)return '';const map=(a.region==='태국')?THAI_IMPACT:GLOBAL_IMPACT;const label=(a.region==='태국')?'생활 연결':'비트코인 연결고리';return `<div class="impact"><b>${label}</b> · ${esc(map[a.category]||(a.region==='태국'?'태국 일반 소식':'시장 뉴스 → 위험 선호·유동성 변화 → BTC'))}</div>`;}
function render(){const arr=data.articles||[];const th=state.tab==='thai';document.querySelector('#feed').innerHTML=arr.length?arr.map(x=>{const t=th;return `<article class="card ${t?'th':''}"><div class="meta"><span class="badge ${x.source_type==='official'?'official':(t?'th':'')}">${esc(x.source)}</span><span class="badge">${esc(x.category)}</span>${t?'':`<span>${esc(x.asset)}</span>`}<span>${age(x.published_at)}</span><span class="rating">${stars(x.priority)}</span></div><div class="title"><a href="${esc(x.link)}" target="_blank" rel="noopener">${hl(x.title)}</a></div>${x.summary?`<div class="summary">${hl(x.summary)}</div>`:''}${impact(x)}<div class="meta">${collectLabel}${age(x.collected_at)} · <a href="${esc(x.link)}" target="_blank" rel="noopener">${openLabel}</a></div></article>`}).join(''):'<div class="empty">'+emptyLabel+'</div>';document.querySelector('#cnt').textContent=(data.total??arr.length);document.querySelector('#shown').textContent=arr.length;document.querySelector('#arch').textContent=(data.archived_total??0);document.querySelector('#more').hidden=!data.has_more;}
function renderSources(){if(PUBLIC)return;const rows=Object.entries(data.sources||{});document.querySelector('#sources').innerHTML=rows.length?rows.map(([name,s])=>`<div class="source"><span>${esc(name)}</span><span class="${s.ok?'ok':'bad'}">${s.ok?okLabel+' '+(s.count??0):failLabel}</span></div>`).join(''):'<div class="note">대기 중</div>';}
function renderGuide(){const el=document.querySelector('#tguide');el.innerHTML=state.tab==='thai'?'<h2>태국 소식 안내</h2><p class="note">방콕포스트·카오솟·타이인콰이어러·프라차타이(영문), 타이랏·마티촌(태국어), 구글뉴스 태국·방콕·교민 검색을 모읍니다.</p><p class="note">비자·이민과 사고·재난을 우선 표시하며, 확정되지 않은 속보는 원문 확인 전까지 단정하지 않습니다.</p>':'<h2>비트코인 관찰 기준</h2><p class="note">유동성·금리, 달러·국채, 미국 정책, 지정학, ETF·기관 수급, 파생상품, 온체인, 스테이블코인, X 발언을 우선 수집합니다.</p><p class="note">뉴스 사실과 시장 해석을 분리합니다. X 게시물과 속보는 공식 발표나 원문 확인 전까지 확정 사실로 취급하지 않습니다.</p>';}
function setTab(next){state.tab=next;state.mode='all';state.value='';state.filter='';state.offset=0;filter='전체';document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===next));const gRow=document.querySelector('#filters-global'),tRow=document.querySelector('#filters-thai');const gHide=next!=='global',tHide=next!=='thai';gRow.hidden=gHide;tRow.hidden=tHide;gRow.style.display=gHide?'none':'flex';tRow.style.display=tHide?'none':'flex';document.querySelectorAll('button[data-filter]').forEach(b=>{const inRow=b.closest('.toolbar');const match=(inRow.id==='filters-thai')===(next==='thai');b.classList.toggle('active',match&&b.dataset.filter==='전체')});renderGuide();load();}
function buildQuery(){const p=new URLSearchParams();
const btn=document.querySelector(state.tab==='thai'?'#tab-thai':'#tab-global');
p.set('region',btn?btn.dataset.region||'':'');
p.set('hours',state.hours);p.set('limit',state.limit);p.set('offset',state.offset);
if(state.q)p.set('q',state.q);
if(state.mode==='priority')p.set('priority',state.value||'5');
else if(state.mode==='official')p.set('source_type','official');
else if(state.mode==='source'&&state.value)p.set('source',state.value);
else if(state.mode==='category'&&state.filter)p.set('category',state.filter);
return p.toString();}
function applyMeta(){const rc=data.region_counts||{};const parts=[];for(const k in rc){parts.push(k+' '+rc[k])}
document.querySelector('#state').textContent=stateLabel;
document.querySelector('#updated').textContent=(data.updated_at_ict||'')+' · '+(data.hours||data.window_hours||24)+'h · '+(data.total??0);
document.querySelector('#updated').title=parts.join(' · ');}
async function load(append){try{const r=await fetch(API_BASE+'/api/news?'+buildQuery()+'&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const fresh=await r.json();if(append&&(data.articles||[]).length){fresh.articles=(data.articles||[]).concat(fresh.articles||[])}data=fresh;try{localStorage.setItem(CACHE_KEY,JSON.stringify(data))}catch(e){}applyMeta();render();renderSources()}catch(e){document.querySelector('#state').textContent=retryLabel;render();renderSources();}}
async function changeInterval(){const value=Number(document.querySelector('#interval').value);try{const r=await fetch(API_BASE+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interval:value})});if(!r.ok)throw Error(r.status);if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(load,value*1000);document.querySelector('#updated').textContent=`갱신 간격 ${value}초로 변경됨 · ${data.total||0}개`;load()}catch(e){alert('갱신 간격 변경 실패: '+e.message);}}
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll('button[data-filter]').forEach(b=>b.onclick=()=>{const row=b.closest('.toolbar');row.querySelectorAll('button[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode||'category';state.value=b.dataset.value||'';state.filter=(state.mode==='category')?(b.dataset.filter||''):'';state.offset=0;load()});
document.querySelector('#q').oninput=()=>{clearTimeout(window.__qt);window.__qt=setTimeout(()=>{state.q=document.querySelector('#q').value.trim();state.offset=0;load()},350)};
document.querySelector('#hours').onchange=()=>{state.hours=Number(document.querySelector('#hours').value)||24;state.offset=0;load()};
document.querySelector('#more').onclick=()=>{state.offset=(data.articles||[]).length;load(true)};
document.querySelector('#interval').onchange=changeInterval;setTab('global');renderSources();refreshTimer=setInterval(()=>load(),60000);
</script></body></html>
