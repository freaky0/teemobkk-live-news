<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>TeemoBKK Live News</title>
<style>:root{--bg:#0a0e1a;--panel:#111a2c;--panel2:#16213a;--text:#eef3ff;--muted:#8b9bbd;--line:#243252;--line2:#2e3d61;--accent:#64d7ff;--thai:#ffd479;--hot:#ffb86b;--official:#8fe3a8;--r-card:14px;--r-ctl:10px;--r-pill:999px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 40px}
.bar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(10,14,26,.92);backdrop-filter:blur(10px)}
.bar-in{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--accent)}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.spacer{flex:1}
.stamp{color:var(--muted);font-size:12px;text-align:right;line-height:1.5}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:6px;margin:22px 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.th.active{color:var(--thai);border-bottom-color:var(--thai)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 220px}
input[type=search]::placeholder{color:var(--muted)}
select{cursor:pointer}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.count b{color:var(--text);font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills[hidden]{display:none!important}
.pill{flex:0 0 auto;scroll-snap-align:start;background:none;border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.pill.th.active{border-color:var(--thai);color:var(--thai)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;margin-top:14px}
.feed{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;border-left:3px solid var(--accent)}
.card.th{border-left-color:var(--thai)}
.card.lead{background:var(--panel2);border-color:var(--line2)}
.lead .title{font-size:24px;line-height:1.32;letter-spacing:-.015em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:9px}
.chip{border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}
.chip.src{background:var(--panel);color:var(--text)}
.chip.official{border-color:var(--official);color:var(--official)}
.chip.hot{border-color:var(--hot);color:var(--hot)}
.chip.th{border-color:#5a4a24;color:var(--thai)}
.title{font-size:17px;line-height:1.45;letter-spacing:-.01em;font-weight:600;margin:0 0 7px}
.title a:hover{color:var(--accent)}
.summary{color:#c3cfe6;font-size:14px;max-width:65ch;margin:0 0 8px}
.summary.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.expand{background:none;border:0;padding:0 0 6px;color:var(--accent);font-size:12.5px;cursor:pointer;font-weight:600}
.card.th .expand{color:var(--thai)}
.impact{color:var(--muted);font-size:12.5px;border-left:2px solid var(--line2);padding-left:9px;margin:2px 0 8px;max-width:65ch}
.impact b{color:var(--text);font-weight:600}
.open{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.open:hover{color:var(--accent);border-bottom-color:var(--accent)}
mark{background:#3f3418;color:#ffe9b0;border-radius:3px;padding:0 2px}
.skel{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;background:var(--panel)}
.skel span{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#18233b,#22304f,#18233b);background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:10px}
.skel span:nth-child(1){width:35%}
.skel span:nth-child(2){width:90%}
.skel span:nth-child(3){width:70%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel span{animation:none}}
.empty{border:1px dashed var(--line);border-radius:var(--r-card);padding:44px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}
.side{display:grid;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.box h2{font-size:12.5px;margin:0 0 9px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.box p{margin:0 0 8px}
.source{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.source:last-child{border-bottom:0}
.source .ok{color:var(--official)}
.source .bad{color:var(--hot)}
.note{color:var(--muted);font-size:12px}
.more-wrap{display:flex;justify-content:center;padding:20px 0 6px}
#more{padding:11px 28px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-ctl);cursor:pointer}
#more:hover{border-color:var(--accent);color:var(--accent)}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:26px;padding-top:16px;line-height:1.8}
body.public .admin{display:none!important}
body.public .side{display:none}
body.public .layout{grid-template-columns:minmax(0,1fr)}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:1fr}}
@media (min-width:1080px){.feed{grid-template-columns:1fr 1fr}.card.lead{grid-column:1 / -1}}
@media (max-width:820px){.wrap{padding:16px 14px 32px}.bar-in{padding:12px 14px}h1{font-size:17px}.stamp{text-align:left;font-size:11.5px}.lead .title{font-size:20px}.count{margin-left:0;width:100%}}
</style>
</head>
<body>

<div style="display:none">
<span id="lbl-ok">정상 연결</span><span id="lbl-retry">재시도 중</span>
<span id="lbl-empty-title">조건에 맞는 뉴스가 없습니다</span><span id="lbl-empty-hint">검색어를 지우거나 기간을 넓혀 보세요.</span>
<span id="lbl-sub">정상</span><span id="lbl-fail">실패</span>
<span id="lbl-collect">수집</span><span id="lbl-open">원문 열기</span>
<span id="lbl-expand">펼쳐보기</span><span id="lbl-collapse">접기</span>
</div>

<header class="bar">
  <div class="bar-in">
    <div>
      <div class="brand">TeemoBKK Live News</div>
      <h1>실시간 뉴스 대시보드</h1>
    </div>
    <div class="spacer"></div>
    <div class="stamp">상태 <b id="state">연결 중</b><br>업데이트 <b id="updated">대기</b></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button id="tab-global" class="tab active" data-tab="global" data-region="글로벌">글로벌 매크로·크립토</button>
    <button id="tab-thai" class="tab th" data-tab="thai" data-region="태국">태국 소식</button>
  </div>

  <section class="toolbar">
    <input id="q" type="search" placeholder="제목·요약 검색" aria-label="뉴스 검색">
    <select id="hours" aria-label="기간">
      <option value="1">최근 1시간</option>
      <option value="6">최근 6시간</option>
      <option value="12">최근 12시간</option>
      <option value="24" selected>최근 24시간</option>
    </select>
    <label class="note admin" for="interval">갱신</label>
    <select id="interval" class="admin" aria-label="갱신 간격">
      <option value="10">10초</option>
      <option value="30">30초</option>
      <option value="60" selected>1분</option>
      <option value="120">2분</option>
      <option value="300">5분</option>
    </select>
    <span class="count">총 <b id="cnt">0</b>건, <b id="shown">0</b>건 표시<span class="admin">, 보관 <b id="arch">0</b>건</span></span>
  </section>

  <section id="filters-global" class="pills">
    <button class="pill active" data-mode="all" data-filter="전체">전체</button>
    <button class="pill" data-mode="priority" data-value="5" data-filter="심">★★★★★ 중요</button>
    <button class="pill" data-filter="유동성·금리">유동성·금리</button>
    <button class="pill" data-filter="미국 정책·트럼프">미국 정책·트럼프</button>
    <button class="pill" data-filter="지정학">지정학</button>
    <button class="pill" data-filter="ETF·수급">ETF·수급</button>
    <button class="pill" data-filter="파생상품·청산">파생상품·청산</button>
    <button class="pill" data-filter="온체인·기관">온체인·기관</button>
    <button class="pill" data-filter="스테이블코인">스테이블코인</button>
    <button class="pill" data-filter="X 발언">X 발언</button>
    <button class="pill" data-filter="주식·원자재">주식·원자재</button>
    <button class="pill" data-filter="채굴">채굴</button>
    <button class="pill" data-filter="규제·정책">규제·정책</button>
    <button class="pill" data-filter="거시경제">거시경제</button>
    <button class="pill" data-filter="시장·가격">시장·가격</button>
    <button class="pill" data-filter="이더리움·알트">이더리움·알트</button>
    <button class="pill" data-mode="source" data-value="FinancialJuice" data-filter="파이낸셜쥬스">파이낸셜쥬스</button>
    <button class="pill" data-mode="source" data-value="CoinNess" data-filter="코인네스">코인네스</button>
    <button class="pill" data-mode="source" data-value="SBHNews" data-filter="SBH뉴스">SBH뉴스</button>
    <button class="pill" data-mode="official" data-filter="공식">공식 발표</button>
  </section>

  <section id="filters-thai" class="pills th" hidden>
    <button class="pill th active" data-mode="all" data-filter="전체">전체</button>
    <button class="pill th" data-mode="priority" data-value="5" data-filter="중요">★★★★★ 중요</button>
    <button class="pill th" data-filter="비자·이민">비자·이민</button>
    <button class="pill th" data-filter="사고·재난">사고·재난</button>
    <button class="pill th" data-filter="태국 생활">생활·교통·날씨</button>
    <button class="pill th" data-filter="태국 경제">태국 경제</button>
    <button class="pill th" data-filter="태국 정치·사회">정치·사회</button>
    <button class="pill th" data-filter="태국 관광">관광</button>
    <button class="pill th" data-filter="태국 보건">보건</button>
  </section>

  <div class="layout">
    <section>
      <div id="feed" class="feed" aria-live="polite"></div>
      <div class="more-wrap"><button id="more" type="button" hidden>더 보기</button></div>
    </section>
    <aside class="side admin">
      <div class="box"><h2>수집 상태</h2><div id="sources"></div></div>
      <div class="box" id="tguide"></div>
    </aside>
  </div>

  <footer class="foot">
    각 기사의 저작권은 원 매체에 있습니다. 제목과 요약, 그리고 원문 링크만 표시하며 원문 확인은 링크를 통해 해 주세요.<br>
    자동 수집 결과이므로 표기 오류나 지연이 있을 수 있습니다. 투자 판단의 근거로 사용하지 마세요.
  </footer>
</main>

<script>

const PUBLIC=!!window.__PUBLIC__;
if(PUBLIC)document.body.classList.add('public');
var lbl=id=>document.querySelector(id).textContent;
const stateLabel=lbl('#lbl-ok'), retryLabel=lbl('#lbl-retry');
const emptyTitle=lbl('#lbl-empty-title'), emptyHint=lbl('#lbl-empty-hint');
const okLabel=lbl('#lbl-sub'), failLabel=lbl('#lbl-fail');
const collectLabel=lbl('#lbl-collect'), openLabel=lbl('#lbl-open');
const expandLabel=lbl('#lbl-expand'), collapseLabel=lbl('#lbl-collapse');
const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8765':'';
const CACHE_KEY='teemo-live-news-cache-v3';
var data={articles:[],sources:{},total:0,has_more:false};
var state={tab:'global',mode:'all',value:'',filter:'',hours:24,q:'',offset:0,limit:15};
var archiveTotal=0, refreshTimer=null;
try{const saved=localStorage.getItem(CACHE_KEY);if(saved){const sn=JSON.parse(saved);if(sn&&sn.region_counts)data=sn}}catch(e){}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(iso){if(!iso)return '시각 미상';const d=new Date(iso),sec=Math.max(0,(Date.now()-d.getTime())/1000);
 if(sec<60)return Math.floor(sec)+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';
 return d.toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function hl(t){const txt=esc(t);const q=(state.q||'').trim();if(!q)return txt;
 const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 try{return txt.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>')}catch(e){return txt}}
const GLOBAL_IMPACT={'유동성·금리':'달러·국채 금리 → 위험자산 선호 → BTC','미국 정책·트럼프':'정책·관세 → 달러·금리·규제 전망 → BTC 변동성','지정학':'전쟁·제재 → 원유·달러 → 위험회피','ETF·수급':'기관 현물 자금 → 매수·매도 압력 → BTC','파생상품·청산':'레버리지 → 강제 청산 → 변동성 확대','온체인·기관':'고래·거래소 유입 → 매도·매수 압력','스테이블코인':'스테이블코인 공급 → 대기 유동성 → BTC','X 발언':'유명 인사 발언 → 단기 심리 → 변동성','주식·원자재':'주식·원자재 → 인플레이션 기대 → BTC','채굴':'채굴자 비용·보유량 → 공급 압력','규제·정책':'규제·과세·법안 → 거래 환경과 자금 흐름','거시경제':'고용·물가·연준 → 금리 기대 → 위험자산','시장·가격':'가격 급등락 → 추세·심리 변화','이더리움·알트':'ETH·알트 수급 → 시장 전체 온기'};
const THAI_IMPACT={'비자·이민':'체류·비자 규정 → 거주 계획과 비용','사고·재난':'해당 지역 이동과 안전 확인','태국 생활':'교통·수도·전기·날씨 → 일상과 생활비','태국 경제':'밧·물가·금리 → 생활비와 송금 환율','태국 정치·사회':'정책·시위 → 치안과 행정 일정','태국 관광':'관광 수요 → 지역 혼잡과 물가','태국 보건':'보건·의료 → 병원 이용과 건강 관리'};
function impact(a){if(PUBLIC)return '';
 const map=(a.region==='태국')?THAI_IMPACT:GLOBAL_IMPACT;
 const label=(a.region==='태국')?'생활 연결':'비트코인 연결고리';
 const text=map[a.category]||(a.region==='태국'?'태국 일반 소식':'시장 뉴스 → 위험 선호 변화 → BTC');
 return '<div class="impact"><b>'+esc(label)+'</b> · '+esc(text)+'</div>'}
function stars(a){const n=Number(a.priority)||0;
 return n>=4?'<span class="chip hot">'+String.fromCharCode(9733).repeat(Math.min(5,n))+'</span>':''}
function summaryBlock(a){
 const s=a.summary||'';if(!s)return '';
 const long=s.length>220;
 return '<div class="summary'+(long?' clamp':'')+'">'+hl(s)+'</div>'+
   (long?'<button class="expand" type="button" aria-expanded="false">'+expandLabel+'</button>':'')}
function card(a,th,lead){
 const src='chip src'+(a.source_type==='official'?' official':'')+(th?' th':'');
 return '<article class="card'+(th?' th':'')+(lead?' lead':'')+'">'+
  '<div class="meta"><span class="'+src+'">'+esc(a.source)+'</span>'+
   '<span class="chip">'+esc(a.category)+'</span>'+
   (th?'':'<span class="chip">'+esc(a.asset)+'</span>')+
   '<span>'+age(a.published_at)+'</span>'+stars(a)+'</div>'+
  '<h2 class="title"><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+hl(a.title)+'</a></h2>'+
  summaryBlock(a)+impact(a)+
  '<div class="meta">'+collectLabel+' '+age(a.collected_at)+'<a class="open" href="'+esc(a.link)+'" target="_blank" rel="noopener">'+openLabel+'</a></div>'+
 '</article>'}
function render(){
 const arr=data.articles||[], th=state.tab==='thai';
 const feed=document.querySelector('#feed');
 feed.innerHTML=arr.length?arr.map((x,i)=>card(x,th,i===0)).join('')
  :'<div class="empty"><b>'+emptyTitle+'</b>'+emptyHint+'</div>';
 document.querySelector('#cnt').textContent=(data.total==null?arr.length:data.total);
 document.querySelector('#shown').textContent=arr.length;
 document.querySelector('#arch').textContent=archiveTotal||0;
 document.querySelector('#more').hidden=!data.has_more}
function renderSources(){
 if(PUBLIC)return;
 const rows=Object.entries(data.sources||{});
 document.querySelector('#sources').innerHTML=rows.length?rows.map(function(pair){
   const s=pair[1];
   return '<div class="source"><span>'+esc(pair[0])+'</span><span class="'+(s.ok?'ok':'bad')+'">'+
     (s.ok?okLabel+' '+(s.count==null?0:s.count):failLabel)+'</span></div>'}).join('')
   :'<div class="note">대기 중</div>'}
function renderGuide(){
 const el=document.querySelector('#tguide');
 el.innerHTML=state.tab==='thai'
  ?'<h2>태국 소식</h2><p class="note">방콕포스트·카오솟·타이인콰이어러·프라차타이(영문), 타이랏·마티촌(태국어), 구글뉴스 태국·방콕·교민 검색을 모읍니다.</p><p class="note">비자·이민과 사고·재난을 우선 표시하며, 확정되지 않은 속보는 원문 확인 전까지 단정하지 않습니다.</p>'
  :'<h2>관찰 기준</h2><p class="note">유동성·금리, 달러·국채, 미국 정책, 지정학, ETF·기관 수급, 파생상품, 온체인, 스테이블코인, X 발언을 우선 수집합니다.</p><p class="note">뉴스 사실과 시장 해석을 분리합니다. X 게시물과 속보는 공식 발표나 원문 확인 전까지 확정 사실로 취급하지 않습니다.</p>'}
function skeleton(){
 document.querySelector('#feed').innerHTML='<div class="skel"><span></span><span></span><span></span></div>'.repeat(2)}
function buildQuery(){
 const p=new URLSearchParams();
 const btn=document.querySelector(state.tab==='thai'?'#tab-thai':'#tab-global');
 p.set('region',btn?btn.dataset.region||'':'');
 p.set('hours',state.hours);p.set('limit',state.limit);p.set('offset',state.offset);
 if(state.q)p.set('q',state.q);
 if(state.mode==='priority')p.set('priority',state.value||'5');
 else if(state.mode==='official')p.set('source_type','official');
 else if(state.mode==='source'&&state.value)p.set('source',state.value);
 else if(state.mode==='category'&&state.filter)p.set('category',state.filter);
 return p.toString()}
function applyMeta(){
 document.querySelector('#state').textContent=stateLabel;
 const rc=data.region_counts||{};
 const total=(data.total==null?0:data.total);
 document.querySelector('#updated').textContent=(data.updated_at_ict||'')+' · '+(data.window_hours||data.hours||24)+'시간 · '+total+'건';
 document.querySelector('#updated').title=Object.keys(rc).map(k=>k+' '+rc[k]).join(', ')}
async function load(append){
 try{
  const r=await fetch(API_BASE+'/api/news?'+buildQuery()+'&ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error(r.status);
  const fresh=await r.json();
  if(append&&(data.articles||[]).length)fresh.articles=(data.articles||[]).concat(fresh.articles||[]);
  data=fresh; archiveTotal=(fresh.archived_total!=null?fresh.archived_total:archiveTotal);
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(data))}catch(e){}
  applyMeta();render();renderSources();
 }catch(e){
  document.querySelector('#state').textContent=retryLabel;
  render();renderSources()}}
async function changeInterval(){
 const value=Number(document.querySelector('#interval').value);
 try{
  const r=await fetch(API_BASE+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interval:value})});
  if(!r.ok)throw Error(r.status);
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(function(){load(false)},value*1000);
  load(false);
 }catch(e){alert('갱신 간격 변경 실패: '+e.message)}}
function setTab(next){
 state.tab=next;state.mode='all';state.value='';state.filter='';state.offset=0;
 document.querySelectorAll('.tab').forEach(function(b){
   const on=b.dataset.tab===next;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});
 const gRow=document.querySelector('#filters-global'), tRow=document.querySelector('#filters-thai');
 const gHide=next!=='global', tHide=next!=='thai';
 gRow.hidden=gHide;tRow.hidden=tHide;
 gRow.style.display=gHide?'none':'flex';tRow.style.display=tHide?'none':'flex';
 document.querySelectorAll('.pill[data-filter]').forEach(function(b){
   const inThai=b.closest('.pills').id==='filters-thai';
   b.classList.toggle('active',(inThai===(next==='thai'))&&b.dataset.filter==='전체')});
 renderGuide();load(false)}

document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){setTab(b.dataset.tab)}});
document.querySelectorAll('.pill[data-filter]').forEach(function(b){b.onclick=function(){
 const row=b.closest('.pills');
 row.querySelectorAll('.pill[data-filter]').forEach(function(x){x.classList.remove('active')});
 b.classList.add('active');
 state.mode=b.dataset.mode||'category';state.value=b.dataset.value||'';
 state.filter=(state.mode==='category')?(b.dataset.filter||''):'';
 state.offset=0;load(false)}});
document.querySelector('#q').oninput=function(){clearTimeout(window.__qt);
 window.__qt=setTimeout(function(){state.q=document.querySelector('#q').value.trim();state.offset=0;load(false)},350)};
document.querySelector('#hours').onchange=function(){state.hours=Number(document.querySelector('#hours').value)||24;state.offset=0;load(false)};
document.querySelector('#more').onclick=function(){state.offset=(data.articles||[]).length;load(true)};
document.querySelector('#interval').onchange=changeInterval;
document.querySelector('#feed').addEventListener('click',function(ev){
 const btn=ev.target.closest('.expand');if(!btn)return;
 const s=btn.previousElementSibling;
 const open=s.classList.toggle('clamp')===false;
 btn.textContent=open?collapseLabel:expandLabel;
 btn.setAttribute('aria-expanded',open?'true':'false')});

skeleton();
setTab('global');
renderSources();
refreshTimer=setInterval(function(){load(false)},60000);

</script>
</body></html>
