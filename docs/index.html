<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TeemoBKK Live News</title>
<style>
:root{
  --bg:#0a0e1a; --panel:#111a2c; --panel2:#16213a; --text:#eef3ff; --muted:#8b9bbd;
  --line:#243252; --line2:#2e3d61; --accent:#64d7ff; --thai:#ffd479; --hot:#ffb86b;
  --official:#8fe3a8; --r-card:14px; --r-ctl:10px; --r-pill:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 40px}
.bar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
  background:rgba(10,14,26,.92);backdrop-filter:blur(10px)}
.bar-in{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--accent)}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.spacer{flex:1}
.stamp{color:var(--muted);font-size:12px;text-align:right;line-height:1.5}
.stamp b{color:var(--text);font-weight:600}
.tabs{display:flex;gap:6px;margin:22px 0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;
  color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-1px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.th.active{color:var(--thai);border-bottom-color:var(--thai)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input[type=search],select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 220px}
input[type=search]::placeholder{color:var(--muted)}
select{cursor:pointer}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.newpill{display:none;align-items:center;background:#123047;border:1px solid var(--accent);color:var(--accent);
  border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;font-size:12.5px;font-weight:600}
.newpill[data-show="1"]{display:inline-flex}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills[hidden]{display:none}
.pill{flex:0 0 auto;scroll-snap-align:start;background:none;border:1px solid var(--line);border-radius:var(--r-pill);
  padding:7px 14px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.pill.th.active{border-color:var(--thai);color:var(--thai)}
.feed{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;
  border-left:3px solid var(--accent)}
.card.th{border-left-color:var(--thai)}
.card.lead{background:var(--panel2);border-color:var(--line2);border-left:3px solid var(--accent)}
.card.lead.th{border-left-color:var(--thai)}
.lead .title{font-size:24px;line-height:1.32;letter-spacing:-.015em}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:9px}
.chip{border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}
.chip.src{background:var(--panel);color:var(--text)}
.chip.official{border-color:var(--official);color:var(--official)}
.chip.hot{border-color:var(--hot);color:var(--hot)}
.chip.th{border-color:#5a4a24;color:var(--thai)}
.title{font-size:17px;line-height:1.45;letter-spacing:-.01em;font-weight:600;margin:0 0 7px}
.title a:hover{color:var(--accent)}
.summary{color:#c3cfe6;font-size:14px;max-width:65ch;margin:0 0 8px}
.summary.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.expand{background:none;border:0;padding:0 0 6px;color:var(--accent);font-size:12.5px;cursor:pointer;font-weight:600}
.card.th .expand{color:var(--thai)}
.open{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.open:hover{color:var(--accent);border-bottom-color:var(--accent)}
mark{background:#3f3418;color:#ffe9b0;border-radius:3px;padding:0 2px}
.skel{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;background:var(--panel)}
.skel span{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#18233b,#22304f,#18233b);
  background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:10px}
.skel span:nth-child(1){width:35%}
.skel span:nth-child(2){width:90%}
.skel span:nth-child(3){width:70%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel span{animation:none}}
.empty{border:1px dashed var(--line);border-radius:var(--r-card);padding:44px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}
.more-wrap{display:flex;justify-content:center;padding:20px 0 6px}
#more{padding:11px 28px;font-weight:700;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r-ctl);cursor:pointer}
#more:hover{border-color:var(--accent);color:var(--accent)}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:26px;padding-top:16px;line-height:1.8}
@media (min-width:1000px){
  .feed{grid-template-columns:1fr 1fr}
  .card.lead{grid-column:1 / -1}
}
@media (max-width:820px){
  .wrap{padding:16px 14px 32px}
  .bar-in{padding:12px 14px}
  h1{font-size:17px}
  .stamp{text-align:left;font-size:11.5px}
  .lead .title{font-size:20px}
  .count{margin-left:0;width:100%}
}
.cal{display:none;margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel)}
.cal[hidden]{display:none}
.cal h2{margin:0 0 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:1fr;gap:2px 22px}
.cal-day h3{margin:0 0 6px;font-size:13px}
.cal-row{display:grid;grid-template-columns:44px 24px 1fr auto;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}
.cal-t{font-weight:600;font-variant-numeric:tabular-nums}
.cal-s{color:var(--hot);font-size:10.5px}
.cal-n{color:#c3cfe6}
.cal-v{color:var(--muted);font-size:12px}
.cal-v b.up{color:#5fd08a}
.cal-v b.down{color:#ff6b6b}
.cal-v b.flat{color:#ffd479}
.cal-s.i3{color:#e04242}
.cal-s.i2{color:#ff9a3c}
.cal-s.i1{color:#ffd479}
.cal-v b{color:var(--official)}
@media (max-width:900px){.cal-grid{grid-template-columns:1fr}}
body.tab-cal .cal{display:block}
body.tab-cal .cal[hidden]{display:none}
body.tab-cal .toolbar,body.tab-cal .pills,body.tab-cal #feed,body.tab-cal .more-wrap,body.tab-cal .side{display:none!important}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div>
      <div class="brand">TeemoBKK Live News</div>
      <h1>실시간 뉴스 대시보드</h1>
    </div>
    <div class="spacer"></div>
    <div class="stamp">업데이트 <b id="updated">-</b><br><span id="window"></span></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button id="tab-global" class="tab active" data-tab="global" role="tab">경제 소식</button>
    <button id="tab-cal" class="tab" data-tab="cal" role="tab">경제 지표</button>
    <button id="tab-thai" class="tab th" data-tab="thai" role="tab">태국 소식</button>
  </div>

  <section class="cal" id="cal" hidden>
    <h2>주요 경제지표 · 한국시각 <span class="note" id="cal-stamp"></span></h2>
    <div class="cal-grid" id="cal-body"></div>
  </section>

  <section class="toolbar">
    <input id="q" type="search" placeholder="제목·요약 검색" aria-label="뉴스 검색">
    <select id="hours" aria-label="기간">
      <option value="1">최근 1시간</option>
      <option value="6">최근 6시간</option>
      <option value="12">최근 12시간</option>
      <option value="24" selected>최근 24시간</option>
    </select>
    <button id="newpill" class="newpill" type="button"></button>
    <span class="count" id="counts"></span>
  </section>

  <section id="filters-global" class="pills"></section>
  <section id="filters-thai" class="pills th" hidden></section>

  <div id="feed" class="feed" aria-live="polite"></div>
  <div class="more-wrap"><button id="more" type="button" hidden>더 보기</button></div>

  <footer class="foot">
    각 기사의 저작권은 원 매체에 있습니다. 제목과 요약, 그리고 원문 링크만 표시하며 원문 확인은 링크를 통해 해 주세요.<br>
    자동 수집 결과이므로 표기 오류나 지연이 있을 수 있습니다. 투자 판단의 근거로 사용하지 마세요.
  </footer>
</main>

<script>
const PAGE=25;
const GLOBAL_CATS=['유동성·금리','미국 정책·트럼프','지정학','ETF·수급','파생상품·청산','온체인·기관','스테이블코인','X 발언','주식·원자재','채굴','규제·정책','거시경제','시장·가격','이더리움·알트'];
const THAI_CATS=[['비자·이민','비자·이민'],['사고·재난','사고·재난'],['태국 생활','생활·교통·날씨'],['태국 경제','태국 경제'],['태국 정치·사회','정치·사회'],['태국 관광','관광'],['태국 보건','보건']];
const DATADIR=/\/thai\/?$/.test(location.pathname)?'../':'';
const FILES={'글로벌':DATADIR+'global.json','태국':DATADIR+'thai.json'};
const WANT_THAI=/\/thai\/?$/.test(location.pathname)||/[?&#]tab=thai/.test(location.search+location.hash);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

var INDEX={};
var MEM={};
var LATEST={};
var PENDING={};
var V={tab:WANT_THAI?'thai':'global',filter:'전체',hours:24,q:'',limit:PAGE};
if(WANT_THAI)document.title='TeemoBKK Live News · 태국 소식';

function region(){return V.tab==='thai'?'태국':'글로벌'}
function pool(){return MEM[region()]||[]}
function age(iso){if(!iso)return '시각 미상';const d=new Date(iso);const sec=Math.max(0,(Date.now()-d.getTime())/1000);
 if(sec<60)return Math.floor(sec)+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';
 return d.toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function hl(t){const txt=esc(t);const q=(V.q||'').trim();if(!q)return txt;
 const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 try{return txt.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>')}catch(e){return txt}}
function keep(a){
  const hours=Number(V.hours)||24;
  const t=new Date(a.published_at).getTime();
  if(!isFinite(t)||Date.now()-t>hours*3600000)return false;
  if(V.filter!=='전체'&&a.category!==V.filter)return false;
  const q=(V.q||'').trim().toLowerCase();
  if(q&&(((a.title||'')+' '+(a.summary||'')).toLowerCase().indexOf(q)<0))return false;
  return true}
function list(){return pool().filter(keep)}
function stars(a){const n=Number(a.priority)||0;
  return n>=4?'<span class="chip hot">'+String.fromCharCode(9733).repeat(Math.min(5,n))+'</span>':''}
function summaryBlock(a){
  const s=a.summary||'';
  if(!s)return '';
  const long=s.length>220;
  return '<div class="summary'+(long?' clamp':'')+'">'+hl(s)+'</div>'+
    (long?'<button class="expand" type="button" aria-expanded="false">펼쳐보기</button>':'')}
function card(a,th,lead){
  const srcCls='chip src'+(a.source_type==='official'?' official':'')+(th?' th':'');
  return '<article class="card'+(th?' th':'')+(lead?' lead':'')+'">'+
    '<div class="meta"><span class="'+srcCls+'">'+esc(a.source)+'</span>'+
      '<span class="chip">'+esc(a.category)+'</span>'+
      '<span>'+age(a.published_at)+'</span>'+stars(a)+
    '</div>'+
    '<h2 class="title"><a href="'+esc(a.link)+'" target="_blank" rel="noopener nofollow">'+hl(a.title)+'</a></h2>'+
    summaryBlock(a)+
    '<a class="open" href="'+esc(a.link)+'" target="_blank" rel="noopener nofollow">원문 열기</a>'+
  '</article>'}
function renderPills(){
  const th=V.tab==='thai';
  const row=document.querySelector(th?'#filters-thai':'#filters-global');
  const other=document.querySelector(th?'#filters-global':'#filters-thai');
  other.hidden=true;
  const cats=th?THAI_CATS:GLOBAL_CATS;
  const items=[['전체','전체']].concat(cats.map(c=>Array.isArray(c)?c:[c,c]));
  row.innerHTML=items.map(pair=>'<button type="button" class="pill'+(th?' th':'')+
    (pair[0]===V.filter?' active':'')+'" data-cat="'+esc(pair[0])+'">'+esc(pair[1])+'</button>').join('');
  row.hidden=false;
  row.querySelectorAll('button[data-cat]').forEach(b=>b.onclick=()=>{
    V.filter=b.dataset.cat;V.limit=PAGE;renderPills();renderFeed()});
  document.querySelectorAll('.tab').forEach(b=>{
    const on=b.dataset.tab===V.tab;
    b.classList.toggle('active',on);
    b.setAttribute('aria-selected',on?'true':'false')});
}
function renderFeed(){
  const all=list();
  const view=all.slice(0,V.limit);
  const th=V.tab==='thai';
  const feed=document.querySelector('#feed');
  if(!view.length){
    feed.innerHTML='<div class="empty"><b>조건에 맞는 뉴스가 없습니다</b>검색어를 지우거나 기간을 넓혀 보세요.</div>';
  }else{
    feed.innerHTML=view.map((a,i)=>card(a,th,i===0)).join('');
  }
  document.querySelector('#counts').textContent='총 '+all.length+'건, '+view.length+'건 표시';
  document.querySelector('#more').hidden=all.length<=view.length;
  const pend=PENDING[region()]||0;
  const np=document.querySelector('#newpill');
  if(pend>0){np.textContent='새 글 '+pend+'건 보기';np.dataset.show='1'}
  else{np.dataset.show='0';np.textContent=''}
}
function renderMeta(){
  document.querySelector('#updated').textContent=INDEX.updated_at_ict||'-';
  const rc=INDEX.region_counts||{};
  const el=document.querySelector('#window');
  el.textContent='보관 '+(INDEX.window_hours||24)+'시간, '+(INDEX.article_count||0)+'건 수집';
  el.title=Object.keys(rc).map(k=>k+' '+rc[k]).join(', ');
}
function skeleton(){
  document.querySelector('#feed').innerHTML=
    '<div class="skel"><span></span><span></span><span></span></div>'.repeat(3)}

async function fetchJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw Error(r.status);
  return r.json()}

async function load(force){
  const target=region();
  try{
    INDEX=await fetchJSON(DATADIR+'index.json?ts='+Date.now());
    const payload=await fetchJSON(FILES[target]+'?ts='+Date.now());
    const fresh=payload.articles||[];
    const current=MEM[target];
    if(current&&current.length){
      const known=new Set(current.map(a=>a.link));
      const added=fresh.filter(a=>!known.has(a.link));
      LATEST[target]=fresh;
      PENDING[target]=added.length;
    }else{
      MEM[target]=fresh;LATEST[target]=fresh;PENDING[target]=0;
    }
    renderMeta();renderPills();renderFeed();
  }catch(e){
    if(!(MEM[region()]||[]).length){
      document.querySelector('#updated').textContent='연결 실패';
      document.querySelector('#feed').innerHTML=
        '<div class="empty"><b>데이터를 불러오지 못했습니다</b>잠시 후 새로고침해 주세요.</div>';
    }
  }
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  V.tab=b.dataset.tab;V.filter='전체';V.limit=PAGE;
  document.body.classList.toggle('tab-cal',V.tab==='cal');
  if(V.tab==='cal'){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='cal'));return}
  if(pool().length){renderPills();renderFeed()}else{skeleton();load(true)}
});
document.querySelector('#q').oninput=()=>{clearTimeout(window.__qt);
  window.__qt=setTimeout(()=>{V.q=document.querySelector('#q').value.trim();V.limit=PAGE;renderFeed()},300)};
document.querySelector('#hours').onchange=()=>{V.hours=Number(document.querySelector('#hours').value)||24;V.limit=PAGE;renderFeed()};
document.querySelector('#more').onclick=()=>{V.limit+=PAGE;renderFeed()};
document.querySelector('#newpill').onclick=()=>{const t=region();if(LATEST[t])MEM[t]=LATEST[t];PENDING[t]=0;V.limit=PAGE;renderFeed()};
document.querySelector('#feed').addEventListener('click',ev=>{
  const btn=ev.target.closest('.expand');
  if(!btn)return;
  const s=btn.previousElementSibling;
  const open=s.classList.toggle('clamp')===false;
  btn.textContent=open?'접기':'펼쳐보기';
  btn.setAttribute('aria-expanded',open?'true':'false')});

skeleton();
var CAL_URL='https://raw.githubusercontent.com/freaky0/teemobkk-live-news/main/docs/calendar.json';
function calEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function calNum(t){var m=String(t==null?'':t).replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}
function calTone(e){var a=calNum(e.actual),c=calNum(e.consensus);if(a===null||c===null)return 'flat';
  var tol=Math.abs(c)*0.02;return Math.abs(a-c)<=tol?'flat':(a>c?'up':'down')}
function paintCalendar(data){
  var days=(data&&data.days)||[];
  if(!days.length)return;
  document.querySelector('#cal-stamp').textContent=(data.updated_at_kst||'')+' KST';
  document.querySelector('#cal-body').innerHTML=days.map(function(d){
    var rows=d.events.length?d.events.map(function(e){
      var parts=[];
      if(e.released)parts.push('실제 <b class="'+calTone(e)+'">'+calEsc(e.actual)+'</b>');
      else if(e.passed)parts.push('발표');
      if(e.consensus)parts.push('예상 '+calEsc(e.consensus));
      if(e.previous)parts.push('이전 '+calEsc(e.previous));
      var val=parts.join(' · ');
      var name=calEsc(e.country_code||e.country)+' · '+calEsc(e.name);
      return '<div class="cal-row"><span class="cal-t">'+calEsc(e.kst)+'</span><span class="cal-s i'+e.importance+'">'+new Array(e.importance+1).join('*')+'</span><span class="cal-n">'+name+'</span><span class="cal-v">'+val+'</span></div>';
    }).join(''):'<div class="note">주요 지표 없음</div>';
    return '<div class="cal-day"><h3>'+calEsc(d.label)+' <span>'+calEsc(String(d.date).slice(5))+' ('+calEsc(d.weekday)+')</span></h3>'+rows+'</div>';
  }).join('');
  document.querySelector('#cal').hidden=false;
}
function loadCalendar(){
  fetch(CAL_URL+'?ts='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw Error(r.status);return r.json();
  }).then(paintCalendar).catch(function(){});
}
