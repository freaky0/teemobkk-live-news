<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TeemoBKK Live News</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--text:#eaf0ff;--muted:#91a0bd;--line:#273656;--accent:#64d7ff;--hot:#ffb86b;--official:#8fe3a8;--thai:#ffd479}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px;flex-wrap:wrap}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
h1{font-size:26px;margin:2px 0 0}
.status{color:var(--muted);text-align:right;font-size:13px;line-height:1.6}
.status strong{color:var(--text)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px 10px 0 0;padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px}
.tabbtn.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.tabbtn.active.th{border-color:var(--thai);color:var(--thai)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:12px}
.toolbar.th{border-color:#4a3c1e}
.toolbar[hidden]{display:none}
button,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13px}
button.active{border-color:var(--accent);color:var(--accent)}
button.th.active{border-color:var(--thai);color:var(--thai)}
input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;min-width:220px;font-size:13px}
.note{color:var(--muted);font-size:12px}
.feed{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px}
.card.th{border-left-color:var(--thai)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.badge.official{border-color:var(--official);color:var(--official)}
.badge.th{border-color:var(--thai);color:var(--thai)}
.title{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:6px}
.title a:hover{color:var(--accent)}
.summary{color:var(--muted);font-size:13px}
.rating{color:var(--hot);letter-spacing:.05em}
.empty{color:var(--muted);text-align:center;padding:38px 12px;border:1px dashed var(--line);border-radius:12px}
.more-wrap{display:flex;justify-content:center;padding:16px 0 4px}
#more{padding:10px 26px;font-weight:700}
mark{background:#4a3c1e;color:#ffe9b0;border-radius:3px;padding:0 2px}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:22px;padding-top:14px;line-height:1.7}
@media (max-width:820px){.wrap{padding:12px}h1{font-size:20px}.status{text-align:left}.title{font-size:15px}.card{padding:12px}input[type=search]{flex:1 1 100%;min-width:0}button{padding:9px 12px}}
</style>
</head>
<body><main class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">TeemoBKK Live News</div>
    <h1>실시간 뉴스 대시보드</h1>
    <div class="note">글로벌 매크로·크립토와 태국 소식을 모아 보여줍니다.</div>
  </div>
  <div class="status">업데이트: <strong id="updated">-</strong><br><span id="window"></span></div>
</header>

<div class="tabs">
  <button id="tab-global" class="tabbtn active" data-tab="global">글로벌 매크로·크립토</button>
  <button id="tab-thai" class="tabbtn th" data-tab="thai">태국 소식</button>
</div>

<section class="toolbar">
  <input id="q" type="search" placeholder="제목·요약 검색">
  <label class="note" for="hours">기간</label>
  <select id="hours">
    <option value="1">1시간</option>
    <option value="6">6시간</option>
    <option value="12">12시간</option>
    <option value="24" selected>24시간</option>
  </select>
  <span class="note" id="counts"></span>
</section>

<section id="filters-global" class="toolbar"></section>
<section id="filters-thai" class="toolbar th" hidden></section>

<div id="feed" class="feed"><div class="empty">뉴스를 불러오는 중입니다.</div></div>
<div class="more-wrap"><button id="more" hidden>더 보기</button></div>

<div class="foot">
  각 기사의 저작권은 원 매체에 있습니다. 제목·요약과 원문 링크만 표시하며, 원문 확인은 링크를 통해 해 주세요.<br>
  자동 수집 결과이므로 표기 오류나 지연이 있을 수 있습니다. 투자 판단의 근거로 사용하지 마세요.
</div>
</main>
<script>
const PAGE=25;
const GLOBAL_CATS=['유동성·금리','미국 정책·트럼프','지정학','ETF·수급','파생상품·청산','온체인·기관','스테이블코인','X 발언','주식·원자재','채굴','규제·정책','거시경제','시장·가격','이더리움·알트'];
const THAI_CATS=[['비자·이민','비자·이민'],['사고·재난','사고·재난'],['태국 생활','생활·교통·날씨'],['태국 경제','태국 경제'],['태국 정치·사회','정치·사회'],['태국 관광','관광'],['태국 보건','보건']];
const FILES={'글로벌':'global.json','태국':'thai.json'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let INDEX={};
const MEM={};
let V={tab:'global',filter:'전체',hours:24,q:'',limit:PAGE};

function region(){return V.tab==='thai'?'태국':'글로벌'}
function pool(){return MEM[region()]||[]}
function age(iso){if(!iso)return '시각 미상';const d=new Date(iso);const sec=Math.max(0,(Date.now()-d.getTime())/1000);
 if(sec<60)return Math.floor(sec)+'초 전';if(sec<3600)return Math.floor(sec/60)+'분 전';if(sec<86400)return Math.floor(sec/3600)+'시간 전';
 return d.toLocaleString('ko-KR',{timeZone:'Asia/Bangkok',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function hl(t){const txt=esc(t);const q=(V.q||'').trim();if(!q)return txt;
 const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 try{return txt.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>')}catch(e){return txt}}
function stars(p){return '★'.repeat(Math.max(1,Math.min(5,Number(p)||1)))}
function keep(a){
  const hours=Number(V.hours)||24;
  const t=new Date(a.published_at).getTime();
  if(!isFinite(t)||Date.now()-t>hours*3600000)return false;
  if(V.filter!=='전체'&&a.category!==V.filter)return false;
  const q=(V.q||'').trim().toLowerCase();
  if(q&&(((a.title||'')+' '+(a.summary||'')).toLowerCase().indexOf(q)<0))return false;
  return true;
}
function list(){return pool().filter(keep)}
function renderCats(){
  const th=V.tab==='thai';
  const row=document.querySelector(th?'#filters-thai':'#filters-global');
  const other=document.querySelector(th?'#filters-global':'#filters-thai');
  other.hidden=true;other.style.display='none';
  const cats=th?THAI_CATS:GLOBAL_CATS;
  const items=[['전체','전체']].concat(cats.map(c=>Array.isArray(c)?c:[c,c]));
  row.innerHTML=items.map(pair=>'<button class="'+(th?'th ':'')+(pair[0]===V.filter?'active':'')+'" data-cat="'+esc(pair[0])+'">'+esc(pair[1])+'</button>').join('');
  row.hidden=false;row.style.display='flex';
  row.querySelectorAll('button[data-cat]').forEach(b=>b.onclick=()=>{V.filter=b.dataset.cat;V.limit=PAGE;renderCats();renderFeed()});
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===V.tab));
}
function renderFeed(){
  const all=list();
  const shown=all.slice(0,V.limit);
  const th=V.tab==='thai';
  document.querySelector('#feed').innerHTML=shown.length?shown.map(a=>
    '<article class="card '+(th?'th':'')+'">'+
      '<div class="meta">'+
        '<span class="badge '+(a.source_type==='official'?'official':(th?'th':''))+'">'+esc(a.source)+'</span>'+
        '<span class="badge">'+esc(a.category)+'</span>'+
        '<span>'+age(a.published_at)+'</span>'+
        '<span class="rating">'+stars(a.priority)+'</span>'+
      '</div>'+
      '<div class="title"><a href="'+esc(a.link)+'" target="_blank" rel="noopener nofollow">'+hl(a.title)+'</a></div>'+
      (a.summary?'<div class="summary">'+hl(a.summary)+'</div>':'')+
    '</article>').join('')
    :'<div class="empty">현재 조건에 해당하는 뉴스가 없습니다.</div>';
  document.querySelector('#counts').textContent='총 '+all.length+'건 · 표시 '+shown.length+'건';
  document.querySelector('#more').hidden=all.length<=shown.length;
}
function renderMeta(){
  document.querySelector('#updated').textContent=INDEX.updated_at_ict||'-';
  const rc=INDEX.region_counts||{};
  const el=document.querySelector('#window');
  el.textContent='보관 '+(INDEX.window_hours||24)+'시간 · '+(INDEX.article_count||0)+'건';
  el.title=Object.keys(rc).map(k=>k+' '+rc[k]).join(' · ');
}
function fail(message){
  document.querySelector('#updated').textContent='연결 실패';
  document.querySelector('#feed').innerHTML='<div class="empty">'+message+'</div>';
  document.querySelector('#more').hidden=true;
}
async function load(force){
  const target=region();
  try{
    const ir=await fetch('index.json?ts='+Date.now(),{cache:'no-store'});
    if(ir.ok)INDEX=await ir.json();
    if(force)delete MEM[target];
    if(!MEM[target]){
      const r=await fetch(FILES[target]+'?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw Error(r.status);
      const payload=await r.json();
      MEM[target]=payload.articles||[];
    }
    renderMeta();renderCats();renderFeed();
  }catch(e){fail('데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.')}
}
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
  V.tab=b.dataset.tab;V.filter='전체';V.limit=PAGE;
  if(MEM[region()]){renderCats();renderFeed()}else{load(false)}
});
document.querySelector('#q').oninput=()=>{clearTimeout(window.__qt);window.__qt=setTimeout(()=>{V.q=document.querySelector('#q').value.trim();V.limit=PAGE;renderFeed()},300)};
document.querySelector('#hours').onchange=()=>{V.hours=Number(document.querySelector('#hours').value)||24;V.limit=PAGE;renderFeed()};
document.querySelector('#more').onclick=()=>{V.limit+=PAGE;renderFeed()};
load(false);
setInterval(()=>load(true),300000);
</script></body></html>
