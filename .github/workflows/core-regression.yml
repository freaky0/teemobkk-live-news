name: Core regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**"
      - "server/**"
      - "pages/**"
      - "tests/**"
      - "collectors/**"
      - "deploy/**"
      - "econ_calendar.py"
      - ".github/workflows/core-regression.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "server/**"
      - "pages/**"
      - "tests/**"
      - "collectors/**"
      - "deploy/**"
      - "econ_calendar.py"
      - ".github/workflows/core-regression.yml"

permissions:
  contents: read

concurrency:
  group: core-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install the browser-test DOM runtime
        run: npm ci --prefix tests
      - name: Run Python and browser regressions against the local build
        env:
          TEEMO_TRANSLATE_KO_ENABLED: "0"
        run: python tests/run.py --local
