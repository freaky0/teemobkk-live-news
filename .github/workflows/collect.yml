name: collect

# The Cloudflare cron trigger fires every five minutes and dispatches this workflow,
# so this file deliberately keeps each run short.
#
# An earlier version kept a five hour loop alive inside one job instead. When that
# loop stalled it held the concurrency group, every later dispatch queued and was
# cancelled, and the published site silently stopped updating. One short run per
# dispatch cannot fail that way: a bad run is simply retried by the next slot.
on:
  schedule:
    - cron: "0 */6 * * *"   # fallback attempts if the cron trigger is ever down
    - cron: "20 */2 * * *"
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the public news JSON and the calendar
        run: python deploy/collect_public.py && python econ_calendar.py docs/calendar.json

      - name: Commit the refreshed data
        run: |
          git config user.name "teemo-live-news-bot"
          git config user.email "teemo-live-news-bot@users.noreply.github.com"
          git add docs
          if git diff --quiet --cached; then
            echo "no change this run"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main && git push
          fi
