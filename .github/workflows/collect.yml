name: collect

# The Cloudflare cron trigger fires every five minutes and dispatches this workflow,
# so this file deliberately keeps each run short.
#
# An earlier version kept a five hour loop alive inside one job instead. When that
# loop stalled it held the concurrency group, every later dispatch queued and was
# cancelled, and the published site silently stopped updating. One short run per
# dispatch cannot fail that way: a bad run is simply retried by the next slot.
on:
  schedule:
    - cron: "0 */6 * * *"   # fallback attempts if the cron trigger is ever down
    - cron: "20 */2 * * *"
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the public news JSON and the calendar
        run: python deploy/collect_public.py && python econ_calendar.py docs/calendar.json

      - name: Commit the refreshed data
        run: |
          git config user.name "teemo-live-news-bot"
          git config user.email "teemo-live-news-bot@users.noreply.github.com"
          git add docs
          if git diff --quiet --cached; then
            echo "no change this run"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"

          # Everything this job generates lives in docs/. Anything else modified here is a
          # bug, and a dirty tree makes `git pull --rebase` refuse to run, which stops the
          # site updating while the schedule keeps firing. Say so, then discard it so the
          # push still lands.
          if ! git diff --quiet; then
            echo "UNEXPECTED unstaged changes, discarding:"
            git status --short
            git checkout -- .
          fi
          # docs/*.json is regenerated every run, so on a race with a hand push the
          # just-generated file must win: -X theirs keeps this run's data. A second
          # attempt covers the case where another run pushed between pull and push.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after retries"; exit 1
