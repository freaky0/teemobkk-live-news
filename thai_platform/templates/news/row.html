<article class="news-item"><div class="news-meta"><span class="tag">{{ article.category|default:'태국 소식' }}</span><time datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|date:'m.d H:i' }} ICT</time></div><h3><a href="{% url 'news-detail' article.id %}{% if list_query %}?from={{ list_query|urlencode }}{% endif %}">{{ article.title }}</a></h3><p>{{ article.summary|truncatechars:160 }}</p><span class="meta">{{ article.source }}</span></article>
