<div class="ticker" id="ticker" role="region" aria-label="암호화폐와 주요 지수 시세">
  <div class="ticker-state" id="ticker-state" data-state="connecting" title="MEXC 연결 상태">
    <span class="dot" aria-hidden="true"></span>
    <span id="ticker-state-text" role="status" aria-live="polite">MEXC 연결 중</span>
    <span class="ticker-age" id="ticker-age"></span>
  </div>
  <div class="ticker-viewport"><div class="ticker-inner" id="ticker-inner"></div></div>
</div>
<header class="top">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="TeemoBKK 홈"><span class="brand-word">TeemoBKK</span></a>
    <nav class="primary-nav" aria-label="주요 섹션">
      <a href="/news/" aria-current="page">뉴스</a>
      <a href="/perspectives/">관점</a>
      <a href="/blog/">블로그</a>
      <a href="/indicators/">지표</a>
      <a href="/tradingtalk/">트레이딩 톡</a>
      <a href="/lab/">지표 연구</a>
    </nav>
    <a class="site-switch" href="/thai/" aria-label="태국 뉴스 사이트로 이동" title="태국 뉴스 사이트로 이동">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25"></circle><path d="M2.9 12h18.2M12 2.75c2.3 2.45 3.45 5.53 3.45 9.25S14.3 18.8 12 21.25C9.7 18.8 8.55 15.72 8.55 12S9.7 5.2 12 2.75Z"></path></svg>
    </a>
    {% if user.is_authenticated %}
      <a class="account-link" href="{% url 'member-profile' %}" aria-label="내 계정" title="내 계정">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      </a>
    {% else %}
      <a class="account-link" href="{% url 'member-login' %}?next={{ request.get_full_path|urlencode }}" aria-label="로그인" title="로그인">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      </a>
    {% endif %}
    <button class="theme-toggle" id="landing-theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환" aria-pressed="false">
      <svg data-theme-icon="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
      <svg data-theme-icon="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path></svg>
    </button>
  </div>
</header>
<script src="/assets/landing/mexc-ticker.js" defer></script>
