{% load form_accessibility %}{% if form.non_field_errors %}<div class="error" role="alert">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<div class="field">{% if field.field.widget.input_type == 'checkbox' %}<label class="check">{{ field|accessible_field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field|accessible_field }}{% endif %}{% if field.errors %}<div class="error" role="alert" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
