<article class="row"><span class="tag">{{ post.get_category_display }}</span><span class="tag">{{ post.get_region_display }}</span><span class="tag">{{ post.get_resolution_display }}</span><h2><a class="title" href="{% url 'post-detail' post.pk %}{% if list_query %}?from={{ list_query|urlencode }}{% endif %}">{{ post.title }}</a></h2><p class="meta">도움 반응 {{ post.helpful_count }}개 · {{ post.author.username }} · {{ post.created_at|date:'Y.m.d H:i' }} ICT</p></article>
