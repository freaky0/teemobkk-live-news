{% extends 'base.html' %}
{% block title %}운영자 게시글 삭제 확인{% endblock %}
{% block content %}<article class="panel"><h1>게시글 삭제 확인</h1><p><strong>{{ post.display_title }}</strong> — {{ post.author.username }}</p><p>삭제하면 게시글이 공개 목록에서 사라지며 이 화면에서 복원할 수 없습니다. 데이터와 답변은 보존됩니다.</p><form method="post" action="{% url 'operator-post-action' post.pk %}">{% csrf_token %}<input type="hidden" name="action" value="delete"><label><input type="checkbox" name="confirm" value="yes" required> 이 게시글을 삭제하겠습니다.</label><div class="actions"><button class="btn danger" type="submit">삭제 확인</button><a class="btn" href="{% url 'operator-hidden-posts' %}">취소</a></div></form></article>{% endblock %}
